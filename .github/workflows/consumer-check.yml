name: Consumer check

# Runs the fixture suite against the PUBLISHED artifact, resolved from Maven Central, on a real
# emulator.
#
# Every other gate in this repo tests the code in this repo. This one tests what a consumer
# actually receives, which is not the same thing and has been the difference before: an artifact
# can resolve and still be wrong — consumer ProGuard rules missing from the AAR, a version
# constant that did not survive publication (the JUnit 5 sibling shipped one release whose
# reports all read 0.0.0-dev), a POM that drags in dependencies the library declared compileOnly.
#
# Run it after publishing, before announcing anything.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to test, e.g. 0.1.0-rc.1'
        required: true
      api-level:
        description: 'API level to run on'
        default: '29'

permissions:
  contents: read

jobs:
  consume:
    name: Resolve ${{ inputs.version }} from Central and run it
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: It is really on Central
        run: |
          base=https://repo1.maven.org/maven2/com/qualflare/qualflare-espresso/${{ inputs.version }}
          stem=qualflare-espresso-${{ inputs.version }}
          for f in "$stem.aar" "$stem.pom" "$stem.module" "$stem-sources.jar" "$stem-javadoc.jar" \
                   "$stem.aar.asc" "$stem.pom.asc"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/$f")
            echo "$code  $f"
            [ "$code" = "200" ] || { echo "::error::$f is not on Central"; exit 1; }
          done

      - name: The POM carries no dependencies
        # Everything is compileOnly on purpose, so a consumer's own Espresso version wins. A POM
        # that leaked them would pin androidx.test for everyone who depends on this.
        run: |
          curl -s -o /tmp/pom.xml \
            https://repo1.maven.org/maven2/com/qualflare/qualflare-espresso/${{ inputs.version }}/qualflare-espresso-${{ inputs.version }}.pom
          if grep -q "<dependencies>" /tmp/pom.xml; then
            echo "::error::the published POM declares dependencies"; grep -A20 "<dependencies>" /tmp/pom.xml; exit 1
          fi
          grep -q "<artifactId>qualflare-espresso</artifactId>" /tmp/pom.xml || {
            echo "::error::unexpected POM"; exit 1; }
          echo "POM is clean"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the fixture against the published artifact
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/emulator.sh ${{ inputs.version }}

      - name: Keep what the run produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-check-${{ inputs.version }}
          path: |
            collected/
            reporter-logcat.txt
          if-no-files-found: warn
          retention-days: 14
