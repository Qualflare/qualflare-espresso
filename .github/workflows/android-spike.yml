# Task 0 of the plan: measure the three things that decide the reporter's shape,
# before the reporter is written.
#
#   1. Does a file written through PlatformTestStorage reach the HOST, with no adb
#      command? The install story ("one Gradle line, then qf collect") rests on AGP
#      pulling additionalTestOutputDir into build/outputs/…_additional_output. That is
#      documented for Gradle Managed Devices and relied on by Jetpack Benchmark for
#      connected devices — but it has to hold on the API levels we claim, and 24 is
#      both the oldest and the likeliest to disappoint.
#   2. Does the `listener` instrumentation argument actually invoke us? Everything
#      depends on it, and nothing references the class except a string.
#   3. Where does testFailure fall relative to @After teardown? That single ordering
#      decides whether screenshot-on-failure can live in the listener or has to be a
#      TestRule.
#
# Dispatch-only plus a weekly cron: an emulator leg is 15-25 minutes and proves
# nothing on an ordinary push.
name: Android spike

on:
  workflow_dispatch:
    inputs:
      api-levels:
        description: 'JSON array of API levels, e.g. [24,29,34]'
        default: '[24,29,34]'
  schedule:
    # Mondays 04:17 UTC. Off the hour on purpose: the top of the hour is when every
    # cron on GitHub fires at once and queue times balloon.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  matrix:
    name: Build the API matrix
    runs-on: ubuntu-latest
    outputs:
      levels: ${{ steps.pick.outputs.levels }}
    steps:
      - id: pick
        run: echo "levels=${{ github.event.inputs.api-levels || '[24,29,34]' }}" >> "$GITHUB_OUTPUT"

  spike:
    name: API ${{ matrix.api }} ${{ matrix.mode }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(needs.matrix.outputs.levels) }}
        # Orchestrator runs every test in its own process, which is expected to yield
        # one report file per test rather than one per run. Measured here, not assumed.
        mode: [plain, orchestrator]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Turn on the orchestrator for this leg
        if: matrix.mode == 'orchestrator'
        run: |
          # Appended rather than committed, so the plain leg is the default shape a
          # consumer gets. clearPackageData is deliberately left OFF: it wipes the
          # app data dir, which is where the storage-unavailable fallback would write.
          cat >> fixture-app/build.gradle.kts <<'KTS'

          android {
              defaultConfig {
                  testInstrumentationRunnerArguments["clearPackageData"] = "false"
              }
              testOptions {
                  execution = "ANDROIDX_TEST_ORCHESTRATOR"
              }
          }

          dependencies {
              androidTestUtil("androidx.test:orchestrator:1.6.1")
          }
          KTS

      # Pinned by commit: this action runs code in a job that has the repository
      # checked out, so a moving tag would change what that code is. Same pin the
      # qualflare-maestro android-probe workflow vetted.
      - name: Run the spike on an emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 24 && 'default' || 'google_apis' }}
          avd-name: qualflare_espresso_api${{ matrix.api }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # One line: the action feeds `script` to sh -c ONE LINE AT A TIME, so
          # anything multi-line belongs in a file. (Learned the hard way on the
          # Maestro probe, where a backslash continuation reached the tool literally.)
          script: bash .github/spike.sh

      - name: Keep everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-api${{ matrix.api }}-${{ matrix.mode }}
          path: |
            fixture-app/build/outputs/connected_android_test_additional_output/**
            fixture-app/build/outputs/androidTest-results/**
            fixture-app/build/reports/androidTests/**
            spike-logcat.txt
          retention-days: 14
          if-no-files-found: warn
