# Versions live here because CI overrides the androidx.test ones to prove the
# floor still compiles: the reporter declares them `compileOnly`, so a consumer's
# own Espresso BOM decides what is actually on the classpath at runtime.
[versions]
agp = "8.13.0"
# The floor is androidx.test:monitor 1.4.0 -- the first release carrying
# androidx.test.platform.io.PlatformTestStorage, which is how the report leaves
# the device. CI compiles against the floor as well as this.
monitor = "1.8.0"
runner = "1.7.0"
espresso = "3.7.0"
extJunit = "1.3.0"
junit = "4.13.2"
robolectric = "4.17"
truth = "1.4.5"

[libraries]
androidx-test-monitor = { module = "androidx.test:monitor", version.ref = "monitor" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "extJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
